name: Create release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to create or update (defaults to mod.version)"
        required: false
        default: ""

jobs:
  create_release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read mod version
        id: mod_version
        shell: bash
        run: |
          value="$(sed -nE 's/^[[:space:]]*mod\.version[[:space:]]*=[[:space:]]*([^[:space:]#]+).*/\1/p' gradle.properties)"
          test -n "$value"
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - name: Choose release tag
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          MOD_VERSION: ${{ steps.mod_version.outputs.value }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            value="$REQUESTED_TAG"
          else
            value="$MOD_VERSION"
          fi
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: ${{ steps.mod_version.outputs.value }}
          target_commitish: ${{ github.sha }}
          body: No changelog available.
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
