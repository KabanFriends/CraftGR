[versions]
# Fabric: https://fabricmc.net/develop/
# NeoForge: https://projects.neoforged.net/

# Toolchains
stonecutter = "0.9.8"
moddev = "2.0.147"
fabric-loom = "1.17-SNAPSHOT"
loom-back-compat = "0.4.2"
blossom = "2.2.0"

# Common Libraries
mixin = "0.17.4+mixin.0.8.7"
jlayer = "1.1.3"
math3 = "3.6.1"

[libraries]
stonecutter = { group = "dev.kikugie", name = "stonecutter", version.ref = "stonecutter" }
mixin = { group = "net.fabricmc", name = "sponge-mixin", version.ref = "mixin" }
jlayer = { group = "me.tamkungz", name = "jlayer-custom", version.ref = "jlayer" }
math3 = { group = "org.apache.commons", name = "commons-math3", version.ref = "math3" }

[plugins]
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
loom-back-compat = { id = "dev.kikugie.loom-back-compat", version.ref = "loom-back-compat" }
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }
